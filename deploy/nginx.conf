server {
    listen 443 ssl;
    server_name bikes.seancai.dev;

    ssl_certificate /etc/letsencrypt/live/bikes.seancai.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bikes.seancai.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 5m;

    location /static/ {
        alias /srv/dublin-bikes/main_project/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}

# Plain http, by domain or by the raw Elastic IP, goes to the https site.
server {
    listen 80;
    server_name bikes.seancai.dev 54.171.204.143;
    return 301 https://bikes.seancai.dev$request_uri;
}
